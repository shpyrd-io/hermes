<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes is starting</title>
<style>
  :root { color-scheme: light dark; --ink: #1a1a1a; --mute: #6b6b6b; --paper: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --mute: #9a9a9a; --paper: #141414; } }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 34rem; margin: 0 auto; padding: 5rem 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Hermes is starting</h1>
  <p>The dashboard is not answering yet. This page tries again every few seconds.</p>
</main>
</body>
</html>
